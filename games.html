  <meta name="description" content="Maths games from the Kevinvariant shop: Factor Fall, Untangle, Billiards Lab, Graph Golf and Orbit Racer, each with a global high-score table.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="style.css?v=20260929">
  <style>
    .wrap{max-width:1120px;margin:0 auto;padding:1.5rem 1.2rem 4rem}
    .sub{color:var(--ink-soft);margin:0 0 1rem;max-width:66ch}
    .picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.8rem;margin:1.2rem 0}
    @media (max-width:520px){.picker{grid-template-columns:1fr}}
    .pick{position:relative;text-align:left;border:1px solid var(--line);border-radius:var(--r-lg);padding:1rem 1.1rem;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit;transition:transform .15s,border-color .15s}
    .pick:hover{transform:translateY(-2px);border-color:var(--aqua)}
    .pick[aria-pressed="true"]{border-color:var(--saffron);box-shadow:0 0 0 2px rgba(255,197,61,.25)}
    .pick h3{font:800 1.15rem var(--display);margin:.2rem 0 .2rem}.pick p{margin:0;color:var(--ink-soft);font-size:.88rem}
    .pick .best{display:block;margin-top:.5rem;font:700 .8rem var(--display);color:var(--saffron)}
    .pick .lk{position:absolute;top:.8rem;right:.9rem;font:700 .68rem var(--display);letter-spacing:.08em;text-transform:uppercase;padding:.15rem .5rem;border-radius:99px;background:var(--rose-wash);color:var(--rose)}
    .stage{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:1rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:1rem;overflow:hidden}
    @media (max-width:900px){.stage{grid-template-columns:1fr}}
    .screen{position:relative;margin:0 auto;border-radius:14px;overflow:hidden;background:#0B0C26;border:1px solid var(--line-soft);touch-action:none}
    .screen canvas,.screen svg{display:block;width:100%;height:auto;touch-action:none}
    .hud{display:flex;flex-wrap:wrap;gap:.4rem 1rem;align-items:center;margin-bottom:.6rem;font:700 .95rem var(--display)}
    .hud span b{color:var(--saffron);font-variant-numeric:tabular-nums}
    .side h3{font:800 1rem var(--display);margin:.2rem 0 .5rem}
    .side .box{background:var(--bg-deep);border:1px solid var(--line-soft);border-radius:12px;padding:.8rem .9rem;margin-bottom:.8rem;font-size:.88rem;color:var(--ink-soft)}
    .side ol{margin:0;padding-left:1.3rem}.side li{margin:.15rem 0}.side li.me{color:var(--saffron);font-weight:700}
    .row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
    .overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:1.2rem;background:rgba(8,9,30,.78);backdrop-filter:blur(3px);z-index:3}
    .overlay[hidden]{display:none}
    .overlay h2{font:800 1.8rem var(--display);margin:0 0 .4rem}.overlay p{color:var(--ink-soft);max-width:44ch;margin:0 auto .9rem}
    .keys{display:grid;grid-template-columns:repeat(8,1fr);gap:.4rem;margin-top:.6rem}
    .key{height:3.2rem;min-width:0;padding:0;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);font:800 1.3rem var(--display);cursor:pointer;position:relative}
    .key small{position:absolute;right:.35rem;bottom:.15rem;font:600 .6rem var(--display);color:var(--ink-faint)}
    .key:active,.key.flash{border-color:var(--saffron);transform:translateY(1px)}
    .key.off{opacity:.3}
    .lockwall{position:absolute;inset:0;z-index:6;display:grid;place-items:center;text-align:center;padding:1.5rem;background:rgba(10,11,32,.86);backdrop-filter:blur(5px)}
    .lockwall[hidden]{display:none}
    .lockwall h2{font:800 1.4rem var(--display);margin:0 0 .4rem}.lockwall p{color:var(--ink-soft);margin:0 0 1rem}
    .ggrow{display:flex;gap:.5rem;align-items:center;margin-top:.7rem}
    .gglab{font:800 1.2rem var(--display);color:var(--saffron)}
    .ggin{flex:1;min-width:0;font:600 1.15rem/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:.7rem .85rem;border-radius:12px;border:2px solid var(--line);background:var(--bg-deep);color:var(--ink)}
    .ggin:focus{outline:none;border-color:var(--aqua)}
    .ggmeta{display:flex;flex-wrap:wrap;gap:.3rem 1rem;margin:.45rem 0 .2rem;font-size:.9rem;color:var(--ink-soft);min-height:1.3em}
    .ggmeta .bad{color:var(--rose)}.ggmeta .ok{color:var(--mint)}
    .orbot{display:flex;gap:1rem;align-items:flex-start;flex-wrap:wrap;margin-top:.6rem}
    .orpad{display:grid;grid-template-columns:repeat(3,3.4rem);gap:.35rem;flex:none;user-select:none;-webkit-user-select:none;touch-action:none}
    .orpad button{height:3.1rem;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:800 1.35rem var(--display);cursor:pointer;touch-action:none}
    .orpad button.sm{font-size:.72rem;letter-spacing:.06em;height:2.3rem}
    .orpad button.thr{background:linear-gradient(180deg,#FFC53D,#FF8A3D);color:#15173B;border:none}
    .orpad button.on{border-color:var(--saffron);box-shadow:0 0 0 2px rgba(255,197,61,.35) inset}
    .orside{flex:1;min-width:220px;display:grid;gap:.5rem}
    .orfuel i{display:inline-block;width:70px;height:8px;border-radius:9px;background:var(--bg-deep);border:1px solid var(--line);vertical-align:middle;margin-left:.3rem;overflow:hidden}
    .orfuel em{display:block;height:100%;background:linear-gradient(90deg,#FF6B8B,#FFC53D)}
    .screen canvas:focus{outline:none}
    .lesson{margin-top:.6rem;padding:.8rem 1rem;border-left:3px solid var(--mint);background:var(--bg-deep);border-radius:0 12px 12px 0;color:var(--ink-soft);font-size:.92rem}
    .lesson b{color:var(--ink)}
    .lvls{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem}
    .lvls button{min-width:2.1rem;height:2.1rem;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:700 .85rem var(--display);cursor:pointer}
    .lvls button.done{border-color:var(--mint);color:var(--mint)}.lvls button.cur{border-color:var(--saffron);color:var(--saffron)}
    .lvls button:disabled{opacity:.35;cursor:default}
  </style>

<main class="wrap">
  <h1>Labs</h1>
  <p class="sub">Five games from the shop, each with a global high-score table. They earn no coins: the only reward is your name above everyone else's, and the maths you notice along the way.</p>
  <div class="picker" id="picker"></div>
  <div class="stage" id="stage">
    <div>
      <div class="hud" id="hud"></div>
      <div class="screen" id="screen"></div>
      <div id="below" style="margin:0 auto"></div>
    </div>
    <aside class="side">
      <h3 id="sideTitle">High scores</h3>
      <div class="box"><ol id="board"><li>Loading&hellip;</li></ol></div>
      <div class="box" id="howto"></div>
    </aside>
    <div class="lockwall" id="lockwall" hidden></div>
  </div>
</main>
<script src="site.js?v=20260929"></script>
<script>
(function(){
  'use strict';
  function $(id){ return document.getElementById(id); }
  function load(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }
  function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function rnd(n){ return Math.floor(Math.random()*n); }
  var reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

  var GAMES=[
    {id:'factor',item:'game-factor',name:'Factor Fall',blurb:'Numbers fall. Split them into primes before they land. Combos, rising speed, and a lot of quick arithmetic.'},
    {id:'untangle',item:'game-untangle',name:'Untangle',blurb:'Drag the points until no two edges cross. The graphs grow every level, and every one of them can be untangled.'},
    {id:'billiards',item:'game-billiards',name:'Billiards Lab',blurb:'Thirteen tables, from mirror tricks and an ellipse with a secret to chaotic stadiums and pinball.'},
    {id:'graph',item:'game-graph',name:'Graph Golf',blurb:'Type a function whose graph threads every star and dodges every wall. Fewer characters, more points.'},
    {id:'orbit',item:'game-orbit',name:'Orbit Racer',blurb:'Race a spaceship through gates using gravity: slingshots, binary suns and a black hole. Read the conic, beat the autopilot.'}
  ];
  var current=null, running=null;

  /* ------------------------------------------------ accounts, ownership and scores */
  function H(){ return window.HU_REWARDS; }
  function A(){ return window.HU_AUTH; }
  function user(){ var a=A(); return a&&a.configured&&a.user&&a.user(); }
  function owns(item){ return !!(H()&&H().coins.owns(item)); }
  function best(id){ return load('hu_lab_best',{})[id]||0; }
  function submit(id,score){
    var b=load('hu_lab_best',{}); if(score>(b[id]||0)){ b[id]=score; save('hu_lab_best',b); }
    var u=user(); if(!u||!score) return Promise.resolve();
    var name=H()&&H().displayName?H().displayName(u):'Player';
    return A().client.rpc('hu_submit_score',{p_game:id,p_score:Math.round(score),p_name:name}).then(function(){ board(id); },function(){});
  }
  function board(id){
    var ol=$('board'), a=A();
    if(!a||!a.configured){ ol.innerHTML='<li>High scores need accounts.</li>'; return; }
    a.client.from('game_scores').select('user_id,name,score').eq('game',id).order('score',{ascending:false}).limit(10).then(function(r){
      if(r.error){ ol.innerHTML='<li>High scores are not set up yet.</li>'; return; }
      if(!r.data.length){ ol.innerHTML='<li>No scores yet. Be the first.</li>'; return; }
      var u=user(); ol.innerHTML=r.data.map(function(x){ return '<li'+(u&&x.user_id===u.id?' class="me"':'')+'>'+esc(x.name)+' <b style="float:right">'+x.score.toLocaleString()+'</b></li>'; }).join(''); });
  }

  /* ------------------------------------------------ picker and lock wall */
  function paintPicker(){
    $('picker').innerHTML=GAMES.map(function(g){ var own=owns(g.item);
      return '<button class="pick" type="button" data-g="'+g.id+'" aria-pressed="'+(current===g.id)+'">'+(own?'':'<span class="lk">Shop</span>')+'<h3>'+g.name+'</h3><p>'+g.blurb+'</p><span class="best">'+(best(g.id)?'Your best: '+best(g.id).toLocaleString():'&nbsp;')+'</span></button>'; }).join('');
    $('picker').querySelectorAll('.pick').forEach(function(b){ b.addEventListener('click',function(){ open(b.dataset.g); }); });
  }
  function gate(){
    var g=GAMES.filter(function(x){ return x.id===current; })[0]; if(!g) return;
    var w=$('lockwall'), own=owns(g.item); w.hidden=own;
    if(!own) w.innerHTML='<div><h2>'+g.name+' is in the shop</h2><p>'+(user()?'Earn coins by solving problems, then unlock it for good.':'Sign in, earn coins by solving problems, then unlock it for good.')+'</p><a class="btn" href="shop.html#labs">Go to the shop</a></div>';
    paintPicker();
  }
  function open(id){
    if(running&&running.stop) running.stop(); running=null;
    current=id; save('hu_lab_last',id); location.hash=id;
    $('screen').innerHTML=''; $('below').innerHTML=''; $('hud').innerHTML=''; $('screen').style.maxWidth=$('below').style.maxWidth='';
    running=({factor:FactorFall,untangle:Untangle,billiards:Billiards,graph:GraphGolf,orbit:OrbitRacer})[id]();
    board(id); gate();
  }

  /* ------------------------------------------------ Graph Golf: expression parser and checker */
  /* GG_CORE_START */
    var GG_FUN={sin:Math.sin,cos:Math.cos,tan:Math.tan,abs:Math.abs,sqrt:Math.sqrt};
    function ggParse(src){
      var s=String(src).replace(/\s+/g,'').toLowerCase().replace(/π/g,'pi').replace(/[×·]/g,'*').replace(/[−–]/g,'-'), i=0, toks=[];
      if(!s) throw new Error('Type a function of x.');
      if(s.length>60) throw new Error('Keep it under 60 characters.');
      while(i<s.length){ var c=s[i], m;
        if((m=/^(\d+\.?\d*|\.\d+)/.exec(s.slice(i)))){ toks.push({t:'n',v:parseFloat(m[1])}); i+=m[1].length; continue; }
        if((m=/^(sqrt|sin|cos|tan|abs|pi|x)/.exec(s.slice(i)))){ toks.push(m[1]==='x'?{t:'x'}:m[1]==='pi'?{t:'n',v:Math.PI}:{t:'f',v:m[1]}); i+=m[1].length; continue; }
        if('+-*/^()'.indexOf(c)>=0){ toks.push({t:c}); i++; continue; }
        throw new Error('I don’t understand “'+c+'”. Use x, numbers, + − × / ^, brackets, pi, sin, cos, tan, abs, sqrt.'); }
      var k=0; function peek(){ return toks[k]; } function eat(t){ if(!toks[k]||toks[k].t!==t) throw new Error(t===')'?'A bracket is not closed.':'Something is missing near the end.'); k++; }
      function startsAtom(tk){ return tk&&(tk.t==='n'||tk.t==='x'||tk.t==='f'||tk.t==='('); }
      function expr(){ var a=term(); while(peek()&&(peek().t==='+'||peek().t==='-')){ var op=peek().t; k++; var b=term(); a=(function(a,b,op){ return op==='+'?function(x){return a(x)+b(x);}:function(x){return a(x)-b(x);}; })(a,b,op); } return a; }
      function term(){ var a=unary(); for(;;){ var tk=peek();
          if(tk&&(tk.t==='*'||tk.t==='/')){ k++; var b=unary(); a=(function(a,b,op){ return op==='*'?function(x){return a(x)*b(x);}:function(x){return a(x)/b(x);}; })(a,b,tk.t); }
          else if(startsAtom(tk)){ var c=power(); a=(function(a,c){ return function(x){ return a(x)*c(x); }; })(a,c); }
          else return a; } }
      function unary(){ if(peek()&&peek().t==='-'){ k++; var a=unary(); return function(x){ return -a(x); }; } if(peek()&&peek().t==='+'){ k++; return unary(); } return power(); }
      function power(){ var a=atom(); if(peek()&&peek().t==='^'){ k++; var b=unary(); return function(x){ return Math.pow(a(x),b(x)); }; } return a; }
      function atom(){ var tk=peek(); if(!tk) throw new Error('Something is missing near the end.'); k++;
        if(tk.t==='n'){ var v=tk.v; return function(){ return v; }; }
        if(tk.t==='x') return function(x){ return x; };
        if(tk.t==='f'){ var fn=GG_FUN[tk.v]; if(!peek()||peek().t!=='(') throw new Error(tk.v+' needs brackets, like '+tk.v+'(x).'); k++; var a=expr(); eat(')'); return function(x){ return fn(a(x)); }; }
        if(tk.t==='('){ var e=expr(); eat(')'); return e; }
        throw new Error('Unexpected “'+tk.t+'”.'); }
      var f=expr(); if(k<toks.length) throw new Error(toks[k].t===')'?'There is an extra closing bracket.':'Unexpected “'+(toks[k].t==='n'?toks[k].v:toks[k].t)+'”.');
      return {f:f,len:s.replace(/pi/g,'π').length};
    }
    var GG_X0=-10,GG_X1=10,GG_DX=0.005;
    function ggSample(f){ var P=[]; for(var x=GG_X0;x<=GG_X1+1e-9;x+=GG_DX){ var y; try{ y=f(x); }catch(e){ y=NaN; } P.push([x,isFinite(y)?y:NaN]); } return P; }
    function ggSegRect(x1,y1,x2,y2,r){ var t0=0,t1=1,dx=x2-x1,dy=y2-y1,p=[-dx,dx,-dy,dy],q=[x1-r[0],r[2]-x1,y1-r[1],r[3]-y1];
      for(var i=0;i<4;i++){ if(p[i]===0){ if(q[i]<0) return -1; } else { var t=q[i]/p[i]; if(p[i]<0){ if(t>t1) return -1; if(t>t0) t0=t; } else { if(t<t0) return -1; if(t<t1) t1=t; } } } return t0; }
    function ggCheck(L,P){
      var stars=L.stars.map(function(st){ var best=1e9; for(var i=0;i<P.length;i++){ var p=P[i]; if(Math.abs(p[0]-st[0])>0.35||isNaN(p[1])) continue; var d=Math.hypot(p[0]-st[0],p[1]-st[1]); if(d<best) best=d; } return best<=0.26; });
      var hit=null, flips=0, arc=0;
      for(var j=1;j<P.length;j++){ var u=P[j-1],v=P[j]; if(isNaN(u[1])||isNaN(v[1])) continue;
        if(Math.abs(u[1])>8&&Math.abs(v[1])>8&&u[1]*v[1]<0){ flips++; continue; }
        var ya=Math.max(-8,Math.min(8,u[1])), yb=Math.max(-8,Math.min(8,v[1])); arc+=Math.hypot(v[0]-u[0],yb-ya); }
      if(flips>8||arc>300) return {stars:L.stars.map(function(){ return false; }),hit:null,ok:false,wiggly:true};
      for(var i=1;i<P.length&&!hit;i++){ var a=P[i-1],b=P[i]; if(isNaN(a[1])||isNaN(b[1])) continue; if(Math.abs(a[1])>8&&Math.abs(b[1])>8&&a[1]*b[1]<0) continue;
        for(var w=0;w<(L.walls||[]).length;w++){ var t=ggSegRect(a[0],a[1],b[0],b[1],L.walls[w]); if(t>=0){ hit={x:a[0]+(b[0]-a[0])*t,y:a[1]+(b[1]-a[1])*t,w:w}; break; } } }
      return {stars:stars,hit:hit,ok:!hit&&stars.every(Boolean)};
    }
  var GG_LEVELS=[
  {name:'Warm-up',par:'x/2',stars:[[-6,-3],[0,0],[6,3]],walls:[],tip:'A straight line through the origin.'},
  {name:'Bowl',par:'x^2',stars:[[-2,4],[-1,1],[0,0],[1,1],[2,4]],walls:[[-7,-1,-3,7],[3,-1,7,7]]},
  {name:'Shifted',par:'x^2-2x-2',stars:[[-1,1],[1,-3],[3,1],[4,6]],walls:[[-8,-7,-3,-2]]},
  {name:'Vee',par:'abs(x+2)',stars:[[-5,3],[-2,0],[1,3],[4,6]],walls:[[-9,-6,-6,-1]]},
  {name:'Wave',par:'2sin(x)',pi:1,stars:[[-Math.PI*1.5,2],[-Math.PI/2,-2],[0,0],[Math.PI/2,2],[Math.PI*1.5,-2]],walls:[[-1.2,2.6,1.2,7],[-1.2,-7,1.2,-2.6]]},
  {name:'Three roots',par:'(x^3-9x)/5',stars:[[-3,0],[-2,2],[-1,1.6],[0,0],[2,-2],[3,0]],walls:[[-6,-7,-4.2,-4],[4.2,4,6,7]]},
  {name:'Over the wall',par:'5-x^2/4',stars:[[-6,-4],[0,5],[6,-4]],walls:[[-1,-7,1,3.5]]},
  {name:'Gates',par:'2sin(pi*x/4)',pi:0,stars:[[-6,2],[-2,-2],[2,2],[6,-2]],walls:[[-4.3,1.2,-3.7,7],[-4.3,-7,-3.7,-1.2],[-0.3,1.2,0.3,7],[-0.3,-7,0.3,-1.2],[3.7,1.2,4.3,7],[3.7,-7,4.3,-1.2]]},
  {name:'Bounce',par:'abs(x^2-4)',stars:[[-3,5],[-2,0],[0,4],[2,0],[3,5]],walls:[[-0.8,-7,0.8,-0.5]]},
  {name:'Root',par:'2sqrt(x+4)',stars:[[-4,0],[-3,2],[0,4],[5,6]],walls:[[-9,1,-5,7],[1,-7,9,2]]},
  {name:'Asymptote',par:'4/x',stars:[[-4,-1],[-2,-2],[-1,-4],[1,4],[2,2],[4,1]],walls:[[-0.6,-0.6,0.6,0.6],[-9,0.5,-3,7],[3,-7,9,-0.5]]},
  {name:'Slalom',par:'x/2+2sin(x)',pi:1,stars:[[-2*Math.PI,-Math.PI],[-Math.PI,-Math.PI/2],[-Math.PI/2,-Math.PI/4-2],[0,0],[Math.PI/2,Math.PI/4+2],[Math.PI,Math.PI/2],[2*Math.PI,Math.PI]],walls:[[1.2,-7,1.9,1.6],[-1.9,-1.6,-1.2,7]]}
];

  /* ------------------------------------------------ Orbit Racer: physics, tracks, autopilot runs */
  /* OR_CORE_START */
    var OR_W=760, OR_H=500, OR_DT=1/120, OR_ROT=3.4, OR_THR=150, OR_TMAX=40;
    function orBodies(T,t){ return T.bodies.map(function(b){ if(!b.orbit) return {x:b.x,y:b.y,r:b.r,gm:b.gm,b:b};
        var o=b.orbit, c=o.about!=null?orBodyPos(T,o.about,t):{x:o.cx,y:o.cy}, a=o.ph+o.w*t; return {x:c.x+o.R*Math.cos(a),y:c.y+o.R*Math.sin(a),r:b.r,gm:b.gm,b:b}; }); }
    function orBodyPos(T,i,t){ var b=T.bodies[i]; if(!b.orbit) return {x:b.x,y:b.y}; var o=b.orbit, c=o.about!=null?orBodyPos(T,o.about,t):{x:o.cx,y:o.cy}, a=o.ph+o.w*t; return {x:c.x+o.R*Math.cos(a),y:c.y+o.R*Math.sin(a)}; }
    function orNew(T){ var s=T.start; return {x:s.x,y:s.y,vx:s.vx||0,vy:s.vy||0,a:s.a||0,fuel:T.fuel,t:0,gate:0,dead:null,done:false,thr:false}; }
    function orSegHit(ax,ay,bx,by,g){ var cx=g[0],cy=g[1],dx=g[2],dy=g[3], r=bx-ax, s=by-ay, u=dx-cx, v=dy-cy, den=r*v-s*u; if(Math.abs(den)<1e-12) return false;
      var t=((cx-ax)*v-(cy-ay)*u)/den, q=((cx-ax)*s-(cy-ay)*r)/den; return t>=0&&t<=1&&q>=0&&q<=1; }
    /* one fixed step. ctl = {rot:-1|0|1, thrust:bool} */
    function orStep(T,S,ctl){ if(S.dead||S.done) return;

  /* ================================================================== UNTANGLE */

    var st=load('hu_lab_untangle',{level:1,total:0}), G=null, drag=null, t0=0, moves=0, timer=0, done=false;
    function gen(nLines){

  /* ================================================================== BILLIARDS LAB */
  function Billiards(){
    var W=760,H0=470, cv=document.createElement('canvas'), ctx=cv.getContext('2d'), dpr=Math.min(2,window.devicePixelRatio||1);

    function regular(n,cx,cy,r,rot){ var p=[]; for(var i=0;i<n;i++){ var a=rot+2*Math.PI*i/n; p.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]); } return p; }

    function stadium(cx,cy,half,r,n){ var p=[],i,a; for(i=0;i<=n;i++){ a=-Math.PI/2+Math.PI*i/n; p.push([cx+half+r*Math.cos(a),cy+r*Math.sin(a)]); } for(i=0;i<=n;i++){ a=Math.PI/2+Math.PI*i/n; p.push([cx-half+r*Math.cos(a),cy+r*Math.sin(a)]); } return p; }
    var LEVELS=[
      {name:'One cushion',goal:'Pot the ball after exactly 1 cushion.',k:1,poly:rect(40,40,720,430),walls:[[[380,150],[380,430]]],S:[150,350],T:[610,350],
       lesson:'<b>The mirror trick.</b> Reflect the pocket in the cushion you want to use, and aim straight at the reflection. The reflected path is a straight line, so the angle in equals the angle out for free.'},
      {name:'Two cushions',goal:'Pot the ball after exactly 2 cushions.',k:2,poly:rect(40,40,720,430),walls:[[[380,40],[380,330]]],S:[140,120],T:[620,130],
       lesson:'<b>Reflect twice.</b> For two cushions, reflect the pocket in one cushion, then reflect that image in the other. Billiard paths in a rectangle become straight lines in a tiling of reflected rectangles: this “unfolding” is how mathematicians study them.'},
      {name:'Three cushions',goal:'Pot the ball after exactly 3 cushions.',k:3,poly:rect(40,40,720,430),walls:[],S:[200,235],T:[560,235],
       lesson:'<b>Unfolding again.</b> Any path with k cushions is a straight line to one of the reflected copies of the pocket. Count the copies at distance k in the tiling and you have counted the possible shots.'},
      {name:'Hexagon',goal:'Pot the ball after exactly 4 cushions.',k:4,poly:regular(6,380,235,215,0),walls:[[[380,140],[380,330]]],S:[250,235],T:[510,235],
       lesson:'<b>Hexagonal tilings.</b> The regular hexagon unfolds into a tiling of the plane too, which is why its billiard paths are as tame as the rectangle’s. Most polygons do not tile like this, and their billiards are still being researched.'},
      {name:'Pentagram',goal:'Return to the cue mark after exactly 5 cushions, on a circular table.',k:5,circle:circlePts(380,235,205),walls:[],S:[380,120],T:[380,120],ret:true,
       lesson:'<b>Rotation numbers.</b> In a circle every bounce turns the path by the same angle, so the ball returns after n cushions exactly when that angle is a rational multiple of a full turn. From this cue mark only 2/5 of a turn works, which is why your path drew a pentagram. Irrational angles never return, and their paths fill a ring densely.'},
      {name:'Whispering gallery',goal:'Pot the ball after at least 1 cushion. The table is an ellipse.',k:-1,ellipse:{cx:380,cy:235,a:330,b:195},walls:[[[380,195],[380,275]]],S:[380-Math.sqrt(330*330-195*195),235],T:[380+Math.sqrt(330*330-195*195),235],
       lesson:'<b>The focus property.</b> Did every shot go in? The ball and the pocket sit on the two foci of the ellipse, and any line through one focus reflects through the other. It is the same geometry that lets a whisper cross a whispering gallery, and it follows from the fact that the distances to the two foci always add up to the same total.'},
      {name:'Maze',goal:'Pot the ball after exactly 6 cushions. The walls count.',k:6,R:10,poly:rect(40,40,720,430),walls:[[[260,40],[260,300]],[[500,170],[500,430]]],S:[140,370],T:[630,100],max:9000,steps:60,
       lesson:'<b>Unfolding with obstacles.</b> The walls in the middle reflect too, so unfolding still works, but now some reflected copies of the pocket hide behind reflected walls. A shot exists exactly when you can see one of the copies at the right distance.'},
      {name:'Triangle',goal:'Pot the ball after exactly 9 cushions.',k:9,R:9,poly:regular(3,380,272,250,-Math.PI/2),S:[300,320],T:[470,250],max:12000,steps:70,
       lesson:'<b>Tiling by reflection.</b> Reflect an equilateral triangle in its sides again and again and you tile the plane, so every path here is a straight line in that tiling. Only a few polygons do this: rectangles, the equilateral triangle, and the 45-45-90 and 30-60-90 right triangles.'},
      {name:'Sinai',goal:'Pot the ball after exactly 5 cushions. The pillar counts.',k:5,R:9,poly:rect(40,40,720,430),pillars:[regular(32,380,235,80,0)],S:[110,235],T:[650,235],max:8000,steps:60,
       lesson:'<b>Sinai billiards.</b> Put a round pillar in a square and the table turns chaotic: every time two nearby paths hit the pillar, the gap between them grows. Yakov Sinai proved in 1970 that a typical path on this table eventually passes close to every point, heading in every direction.'},
      {name:'Off focus',goal:'Pot the ball after exactly 8 cushions. The table is an ellipse again, but nothing is at a focus.',k:8,R:8,ellipse:{cx:380,cy:235,a:330,b:195},S:[210,300],T:[560,170],max:12000,steps:80,
       lesson:'<b>Caustics.</b> In an ellipse every path stays tangent to a hidden curve with the same foci: a smaller ellipse, or a hyperbola. That curve, the caustic, is why some shots sweep round the whole table and others stay trapped in a band through the middle.'},
      {name:'Stadium',goal:'Pot the ball after exactly 7 cushions.',k:7,R:9,poly:stadium(380,235,170,180,24),S:[250,300],T:[520,160],max:8000,steps:60,
