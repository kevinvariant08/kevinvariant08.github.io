<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline | Kevinvariant</title>
  <link rel="icon" href="/favicon.svg?v=4" type="image/svg+xml">
  <link rel="manifest" href="/site.webmanifest?v=5">
  <meta name="theme-color" content="#F6F4EF">
  <style>
    :root{--bg:#F6F4EF;--ink:#15173B;--soft:#4a4d6b;--line:#dcd8cc;--card:#fff}
    @media (prefers-color-scheme:dark){:root:not([data-mode="light"]){--bg:#15173B;--ink:#F3F1EA;--soft:#b9bbd3;--line:#33366a;--card:#1d2050}}
    :root[data-mode="dark"]{--bg:#15173B;--ink:#F3F1EA;--soft:#b9bbd3;--line:#33366a;--card:#1d2050}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;box-sizing:border-box}
    .box{max-width:30rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.6rem 1.5rem;text-align:center}
    img{width:56px;height:56px}
    h1{font-size:1.4rem;margin:.6rem 0 .4rem}
    p{color:var(--soft);margin:.4rem 0}
    button{margin-top:1rem;font:inherit;font-weight:600;padding:.6rem 1.2rem;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;min-height:44px}
  </style>
  <script>try{if(localStorage.getItem('kv_mode')==='dark')document.documentElement.setAttribute('data-mode','dark')}catch(e){}</script>
</head>
<body>
  <div class="box">
    <img src="/favicon.svg?v=4" alt="">
    <h1>You're offline</h1>
    <p>This page hasn't been saved on this device yet. Pages, drills and PDFs you've opened before still work without a connection, so go back and carry on with those.</p>
    <p>Everything else will load again as soon as you're back online.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
