  <script>try{if(localStorage.getItem('kv_mode')==='dark')document.documentElement.setAttribute('data-mode','dark')}catch(e){}</script>
  <style>
    .hu{--soft:var(--ink-soft);--faint:var(--ink-faint);--rule:var(--line);--paper:var(--bg);--ok:var(--mint);--bad:var(--rose);--warn:var(--saffron);--acc:var(--aqua);--acc2:color-mix(in srgb,var(--aqua) 35%,transparent);
        --serif:"IBM Plex Serif",Georgia,serif;--sans:var(--display);font-family:var(--sans);color:var(--ink);line-height:1.55}
    .hu h2{font-family:var(--serif);font-weight:600}
    .hu h3{font-family:var(--serif);font-weight:600;font-size:1.05rem;margin:1.2rem 0 .4rem}
    .hu p{max-width:70ch}
    .hu .lead{font-size:1.05rem;color:var(--soft)}
    .hu .hidden{display:none!important}
    .hu .btn2{font-family:var(--sans);font-size:.95rem;font-weight:500;color:var(--ink);background:transparent;border:1px solid var(--ink);border-radius:2px;padding:.5rem 1rem;cursor:pointer}
    .hu .btn2:hover{background:var(--ink);color:var(--on-accent)}
    .hu .btn2.quiet{border-color:var(--rule);color:var(--soft);font-weight:400}
    .hu .btn2.quiet:hover{background:transparent;border-color:var(--ink);color:var(--ink)}
    .hu .btn2[disabled]{opacity:.35;cursor:default}
    .hu .row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:.9rem}
    .hu .panel{border:1px solid var(--rule);padding:1rem 1.2rem;margin:1.2rem 0}
    .hu select,.hu input[type=text],.hu textarea{font-family:var(--sans);font-size:.95rem;padding:.45rem .6rem;border:1px solid var(--rule);border-radius:2px;background:var(--bg-deep);color:var(--ink)}
    .hu textarea{width:100%;resize:vertical;line-height:1.5}
    .hu .tally{color:var(--faint);font-size:.88rem}
    .hu .err{color:var(--bad);font-size:.9rem}
    .hu .ok{color:var(--ok)} .hu .bad{color:var(--bad)}
    .hu .stats{display:flex;gap:2.2rem;flex-wrap:wrap;margin:1.2rem 0}
    .hu .stat .big{font-family:var(--serif);font-weight:600;font-size:2.2rem;line-height:1}
    .hu .stat .lab{font-size:.82rem;color:var(--faint)}
    .hu .two{display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:start}
    @media (max-width:820px){.hu .two{grid-template-columns:1fr}}
    .hu svg{display:block;width:100%;height:auto}
    .hu .bar{height:6px;background:var(--rule);position:relative;margin:.2rem 0 .7rem;max-width:26rem}
    .hu .bar span{position:absolute;left:0;top:0;height:100%;background:var(--acc)}
    .hu .trow{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;font-size:.92rem;max-width:26rem}
    .hu .trow a{font-size:.82rem;color:var(--soft)}
    .hu .heat{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;max-width:22rem}
    .hu .heat div{aspect-ratio:1;background:var(--rule)}
    .hu .heat div.l1{background:color-mix(in srgb,var(--aqua) 30%,transparent)} .hu .heat div.l2{background:color-mix(in srgb,var(--aqua) 62%,transparent)} .hu .heat div.l3{background:var(--acc)}
    .hu table{border-collapse:collapse;font-size:.9rem}
    .hu td,.hu th{border-bottom:1px solid var(--rule);padding:.3rem .9rem .3rem 0;text-align:left;font-weight:400}
    .hu th{color:var(--faint)}
    .hu .ctip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:.35rem .6rem;font-size:.85rem;min-width:9rem;box-shadow:0 2px 8px rgba(0,0,0,.12)}
    .hu .ctip strong{display:block;color:var(--ink)} .hu .ctip span{color:var(--ink-soft)}
    .hu .cpt{cursor:default;outline:none} .hu .cpt:focus-visible .dot,.hu .cpt:hover .dot{stroke:var(--ink);stroke-width:2.5}
    .hu .rec{border-left:2px solid var(--acc);padding:.3rem 0 .3rem 1rem;font-family:var(--serif);font-size:1.02rem;margin:1.2rem 0}
  </style>
</head>
<body data-theme-v2>
  <nav id="sitenav"><div class="nav-links"><a href="index.html">Home</a> <a href="drill.html">Drill</a> <a href="arena.html">Arena</a> <a href="bank.html">Question bank</a></div></nav>
  <main class="container hu">
    <h1>Progress</h1>
    <p class="lead">Everything you have done on this site, in one place: drill accuracy by technique, how long questions take you, how your interview scores are moving, and what to do next. It is all read from this browser, so it is yours alone.</p>
    <div id="body"></div>
  </main>

<script src="traps.js?v=20261023"></script>
<script src="trap-map.js?v=20261023"></script>
<script src="confidence.js?v=20261024"></script>
<script>
function load(k,d){ try{ return JSON.parse(localStorage.getItem(k)||'null')||d; }catch(e){ return d; } }
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function fmt(s){ s=Math.max(0,Math.round(s)); var m=Math.floor(s/60), r=s%60; return m+':'+(r<10?'0':'')+r; }
var TECH={sym:'Symmetry and substitution',tel:'Telescoping',two:'Counting two ways',inv:'Invariants',pig:'Pigeonhole',mod:'Modular arithmetic',vie:'Vieta and symmetric functions',trg:'Trigonometric identities and bounds',arint:'Integrals as areas or by symmetry',fint:'Integral reasoning',root:'Root counting via monotonicity',ext:'Extremal principle',col:'Colouring and parity',game:'Games and losing positions',log:'Quantifiers, negation and vacuous truth',prf:'Proof analysis',ns:'Necessary and sufficient',ineq:'Inequalities',circ:'Circle geometry',ser:'Series and sequences',poly:'Polynomials',cnt:'Counting arguments',exp:'Exponentials and logarithms',trans:'Graph transformations',bin:'Binomial expansion',diff:'Differentiation, tangents and stationary points',coord:'Coordinate geometry',quad:'Quadratics, discriminants and parameters'};
var PAPER_NAME={J1:'Set J Paper 1','setJ-p1':'Set J Paper 1',J2:'Set J Paper 2','setJ-p2':'Set J Paper 2',I1:'Set I Paper 1','setI-p1':'Set I Paper 1',I2:'Set I Paper 2','setI-p2':'Set I Paper 2',L1:'Set L Paper 1','setL-p1':'Set L Paper 1',L2:'Set L Paper 2','setL-p2':'Set L Paper 2',K1:'Set K Paper 1','setK-p1':'Set K Paper 1',K2:'Set K Paper 2','setK-p2':'Set K Paper 2',H1:'Set H Paper 1','setH-p1':'Set H Paper 1',H2:'Set H Paper 2','setH-p2':'Set H Paper 2',G1:'Set G Paper 1','setG-p1':'Set G Paper 1',G2:'Set G Paper 2','setG-p2':'Set G Paper 2',D1:'Set D Paper 1','setD-p1':'Set D Paper 1',D2:'Set D Paper 2','setD-p2':'Set D Paper 2',E1:'Set E Paper 1','setE-p1':'Set E Paper 1',E2:'Set E Paper 2','setE-p2':'Set E Paper 2',F1:'Set F Paper 1','setF-p1':'Set F Paper 1',F2:'Set F Paper 2','setF-p2':'Set F Paper 2',C1:'Set C Paper 1',C2:'Set C Paper 2',B1:'Set B Paper 1',B2:'Set B Paper 2','setC-p1':'Set C Paper 1','setC-p2':'Set C Paper 2','setB-p1':'Set B Paper 1','setB-p2':'Set B Paper 2','setA-p1':'Set A Paper 1','setA-p2':'Set A Paper 2'};

var L=load('hu_drill_log',[]), A=load('hu_drill_attempts',[]), IV=load('hu_iv_hist',[]), SC=load('hu_scores',[]);
var out='';
if(!L.length&&!A.length&&!IV.length&&!SC.length){
  out='<div class="panel"><p>Nothing recorded yet. Start with a <a href="drill.html">drill</a> or a <a href="interviews.html">mock interview</a> and this page fills itself in.</p></div>';
} else {
  var correct=L.filter(function(e){return e.correct;}).length, med=null;
  if(L.length){ var t=L.map(function(e){return e.secs;}).sort(function(a,b){return a-b;}); med=t[Math.floor(t.length/2)]; }
  var days={}; L.forEach(function(e){days[new Date(e.t).toISOString().slice(0,10)]=(days[new Date(e.t).toISOString().slice(0,10)]||0)+1;}); IV.forEach(function(r){days[r.date]=(days[r.date]||0)+3;}); SC.forEach(function(r){days[r.date]=(days[r.date]||0)+2;});
  var streak=0, d=new Date(); for(var i=0;i<400;i++){ var k=d.toISOString().slice(0,10); if(days[k]) streak++; else if(i>0) break; d.setDate(d.getDate()-1); }
  var ivScores=IV.filter(function(r){return r.score!=null;}).map(function(r){return r.score;}).reverse();
  out+='<div class="stats"><div class="stat"><div class="big">'+L.length+'</div><div class="lab">questions answered</div></div>'
     +(L.length?'<div class="stat"><div class="big">'+Math.round(100*correct/L.length)+'%</div><div class="lab">accuracy</div></div><div class="stat"><div class="big">'+fmt(med)+'</div><div class="lab">median time per question</div></div>':'')
     +'<div class="stat"><div class="big">'+IV.length+'</div><div class="lab">interviews</div></div>'
     +(ivScores.length?'<div class="stat"><div class="big">'+ivScores[ivScores.length-1]+'</div><div class="lab">latest interview score</div></div>':'')
     +'<div class="stat"><div class="big">'+streak+'</div><div class="lab">day streak</div></div></div>';

  // technique stats
  var st={}; L.forEach(function(e){ e.tags.forEach(function(t){ st[t]=st[t]||{n:0,c:0,secs:0}; st[t].n++; st[t].secs+=e.secs; if(e.correct) st[t].c++; }); });
  var keys=Object.keys(st).filter(function(k){return TECH[k];});
  if(keys.length){
    keys.sort(function(a,b){return (st[a].c/st[a].n)-(st[b].c/st[b].n);});
    var weakest=keys.filter(function(k){return st[k].n>=2;})[0]||keys[0];
    out+='<div class="rec">Weakest technique with enough data: <strong>'+esc(TECH[weakest])+'</strong> at '+Math.round(100*st[weakest].c/st[weakest].n)+'% over '+st[weakest].n+' questions. <a href="drill.html?tech='+weakest+'">Drill it now</a>, or run <a href="drill.html">Weakest first</a>.</div>';
    // radar
    var rk=keys.slice().sort(function(a,b){return TECH[a].localeCompare(TECH[b]);}), n=rk.length, cx=200,cy=190,R=130, radar='';
    if(n>=3){
      var pts=rk.map(function(k,i){ var a=-Math.PI/2+i*2*Math.PI/n, r=R*(st[k].c/st[k].n); return [cx+r*Math.cos(a),cy+r*Math.sin(a),a]; });
      radar='<svg viewBox="0 0 400 380" role="img" aria-label="Technique accuracy radar">';
      [0.25,0.5,0.75,1].forEach(function(f){ radar+='<polygon points="'+rk.map(function(k,i){var a=-Math.PI/2+i*2*Math.PI/n; return (cx+R*f*Math.cos(a))+','+(cy+R*f*Math.sin(a));}).join(' ')+'" fill="none" style="stroke:var(--line)" stroke-width="'+(f===1?1:0.5)+'"/>'; });
      radar+='<polygon points="'+pts.map(function(p){return p[0]+','+p[1];}).join(' ')+'" style="fill:color-mix(in srgb,var(--aqua) 35%,transparent);stroke:var(--aqua)" fill-opacity=".35" stroke-width="1.5"/>';
      rk.forEach(function(k,i){ var a=-Math.PI/2+i*2*Math.PI/n, lx=cx+(R+16)*Math.cos(a), ly=cy+(R+16)*Math.sin(a); var anchor=Math.abs(Math.cos(a))<0.2?'middle':(Math.cos(a)>0?'start':'end'); radar+='<text x="'+lx+'" y="'+(ly+4)+'" text-anchor="'+anchor+'" font-family="IBM Plex Sans,sans-serif" font-size="10.5" style="fill:var(--ink-soft)">'+esc(TECH[k].split(' ')[0])+'</text>'; });
      radar+='</svg>';
    }
    var bars=keys.map(function(k){ var pc=Math.round(100*st[k].c/st[k].n); return '<div class="trow"><span>'+esc(TECH[k])+' <span class="tally">'+st[k].c+'/'+st[k].n+' \u00b7 '+fmt(st[k].secs/st[k].n)+' avg</span></span><a href="drill.html?tech='+k+'">drill</a></div><div class="bar"><span style="width:'+pc+'%"></span></div>'; }).join('');
    out+='<div class="two"><div><h3>Accuracy by technique</h3>'+bars+'</div><div><h3>Shape of your strengths</h3>'+(radar||'<p class="tally">The radar appears once three techniques have data.</p>')+'</div></div>';
  }

  out+='<div id="trapprof"></div><div id="confprof"></div>';

  // time distribution
  if(L.length){
    var buckets=[[0,60,'under 1 min'],[60,120,'1 to 2'],[120,180,'2 to 3'],[180,240,'3 to 4'],[240,1e9,'over 4']], mx=1;
    var bd=buckets.map(function(b){ var inb=L.filter(function(e){return e.secs>=b[0]&&e.secs<b[1];}); var c=inb.filter(function(e){return e.correct;}).length; mx=Math.max(mx,inb.length); return {lab:b[2],n:inb.length,c:c}; });
    var W=520,H=170,bw=W/bd.length, svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Time per question">';
    bd.forEach(function(b,i){ var h=(b.n/mx)*(H-50), x=i*bw+12, y=H-30-h, hc=b.n?h*b.c/b.n:0;
      svg+='<rect x="'+x+'" y="'+y+'" width="'+(bw-24)+'" height="'+h+'" style="fill:color-mix(in srgb,var(--rose) 32%,transparent)"/><rect x="'+x+'" y="'+(y+h-hc)+'" width="'+(bw-24)+'" height="'+hc+'" style="fill:color-mix(in srgb,var(--mint) 32%,transparent)"/>';
      svg+='<text x="'+(x+(bw-24)/2)+'" y="'+(H-12)+'" text-anchor="middle" font-family="IBM Plex Sans,sans-serif" font-size="11" style="fill:var(--ink-soft)">'+b.lab+'</text>';
      if(b.n) svg+='<text x="'+(x+(bw-24)/2)+'" y="'+(y-4)+'" text-anchor="middle" font-family="IBM Plex Sans,sans-serif" font-size="11" style="fill:var(--ink-faint)">'+b.c+'/'+b.n+'</text>'; });
    svg+='</svg>';
    out+='<h3>Time per question</h3><p class="tally">Green is correct, red is wrong. A TMUA question has 3 minutes 45 seconds on average; a high wrong count in the long buckets means you are spending time without converting it, which is the main thing to change.</p>'+svg;
  }

  // interviews + papers
  var rows='';
  if(ivScores.length>=2){
    var W2=520,H2=140,n2=ivScores.length, pts2=ivScores.map(function(s,i){return [30+i*(W2-60)/(n2-1),H2-20-s*(H2-40)/10];});
    var line='<svg viewBox="0 0 '+W2+' '+H2+'" role="img" aria-label="Interview scores"><line x1="30" y1="'+(H2-20)+'" x2="'+(W2-30)+'" y2="'+(H2-20)+'" style="stroke:var(--line)"/><line x1="30" y1="'+(H2-20-6*(H2-40)/10)+'" x2="'+(W2-30)+'" y2="'+(H2-20-6*(H2-40)/10)+'" style="stroke:var(--line)" stroke-dasharray="4 3"/><text x="'+(W2-28)+'" y="'+(H2-22-6*(H2-40)/10)+'" font-family="IBM Plex Sans,sans-serif" font-size="10" style="fill:var(--ink-faint)">offer level</text>'
      +'<polyline points="'+pts2.map(function(p){return p[0]+','+p[1];}).join(' ')+'" fill="none" style="stroke:var(--aqua)" stroke-width="1.6"/>'+pts2.map(function(p,i){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.5" style="fill:var(--aqua)"/><text x="'+p[0]+'" y="'+(p[1]-8)+'" text-anchor="middle" font-family="IBM Plex Sans,sans-serif" font-size="11" style="fill:var(--ink-soft)">'+ivScores[i]+'</text>';}).join('')+'</svg>';
    out+='<h3>Interview scores</h3>'+line;
  }
  if(A.length){ var TIM={4500:'standard',5400:'+20%',5625:'+25%',6750:'+50%',9000:'+100%',0:'untimed'};
    rows=A.slice(0,10).map(function(a){return '<tr><td>'+esc(a.date)+'</td><td>'+esc(PAPER_NAME[a.paper]||a.paper)+'</td><td>'+a.score+'/20</td><td>'+fmt(a.secs)+'</td><td>'+esc(TIM[a.timing==null?4500:a.timing]||'')+(a.pauses?', paused '+a.pauses+'\u00d7':'')+'</td></tr>';}).join('');
    out+='<h3>Timed papers</h3><table><tr><th>Date</th><th>Paper</th><th>Score</th><th>Time</th><th>Conditions</th></tr>'+rows+'</table><p class="tally"><a href="results.html">Compare against everyone else.</a></p>'; }

  // heatmap 12 weeks
  var cells='', today=new Date(); today.setHours(0,0,0,0);
  var start=new Date(today); start.setDate(start.getDate()-83); start.setDate(start.getDate()-((start.getDay()+6)%7));
  for(var wk=0;wk<12;wk++) for(var dd=0;dd<7;dd++){ var dt=new Date(start); dt.setDate(dt.getDate()+wk*7+dd); if(dt>today){ cells+='<div style="visibility:hidden"></div>'; continue; } var kk=dt.toISOString().slice(0,10), v=days[kk]||0; cells+='<div class="'+(v>=8?'l3':v>=4?'l2':v>0?'l1':'')+'" title="'+kk+': '+v+'"></div>'; }
  out+='<h3>Activity, last twelve weeks</h3><div class="heat">'+cells+'</div>';
}
document.getElementById('body').innerHTML=out;

// Trap Profile: the mistakes behind wrong answers, from trap-map.js
var trapAdmin=null;
function paintTraps(){ var el=document.getElementById('trapprof'), TM=window.HU_TRAPMAP; if(!el||!TM) return; var adm=TM.admin(), H=window.HU_REWARDS; trapAdmin=adm;
  if(!TM.anyVisible(adm)){ el.innerHTML=''; return; }
  var rows=TM.profile(L,adm).slice(0,6).map(function(p){ var cl=H&&H.trapCleared&&H.trapCleared(p.type);
    return '<div class="trow"><span><strong>'+esc(p.name)+'</strong> <span class="tally">fell for it '+p.falls+' of '+p.chances+' time'+(p.chances>1?'s':'')+', last on '+new Date(p.last).toLocaleDateString('en-GB',{day:'numeric',month:'short'})+(cl?', cleared this week':'')+'</span></span>'
      +(p.n?'<a href="drill.html?trap='+encodeURIComponent(p.type)+'">drill</a>':'')+'</div>'; }).join('');
  el.innerHTML='<h3 id="traps">My Trap Profile</h3><p class="tally">The mistakes behind your wrong answers, most frequent first. A trap drill gives you up to five questions where that mistake leads to one of the options. Get 4 of 5 right to clear the trap.</p>'
    +(rows||'<p class="tally">No traps recorded yet. When a wrong answer matches a known mistake, it appears here.</p>'); }
paintTraps();
window.addEventListener('hu-rewards',function(){ if(window.HU_TRAPMAP&&HU_TRAPMAP.admin()!==trapAdmin) paintTraps(); });

// Confidence: stated confidence against accuracy, from answers rated Guess, Unsure or Sure (confidence.js)
var confWeekShown=false;
function paintConf(){ var el=document.getElementById('confprof'), C=window.HU_CONF; if(!el||!C) return;
  var st=C.stats(L,TECH), head='<h3 id="confidence">Confidence</h3>';
  if(!st.n){ el.innerHTML=head+'<p class="tally">Say how sure you are (Guess, Unsure or Sure) before checking an answer in <a href="drill.html">Drill</a> or the <a href="bank.html">question bank</a>, and this section shows whether that confidence is justified.</p>'; return; }
  /* plot: stated confidence (x) against accuracy (y), both 0 to 100; the diagonal is where they match */
  var X0=46,X1=324,Y0=206,Y1=14, sx=function(v){ return X0+(X1-X0)*v/100; }, sy=function(v){ return Y0-(Y0-Y1)*v/100; };
  var svg='<svg viewBox="0 0 340 250" role="img" aria-label="Accuracy at each confidence level; the table below gives the values">';
  [0,50,100].forEach(function(v){ svg+='<line x1="'+X0+'" x2="'+X1+'" y1="'+sy(v)+'" y2="'+sy(v)+'" style="stroke:var(--line-soft)" stroke-width="1"/><text x="'+(X0-8)+'" y="'+(sy(v)+4)+'" text-anchor="end" font-size="11" style="fill:var(--ink-faint)">'+v+'%</text>'; });
  svg+='<line x1="'+sx(0)+'" y1="'+sy(0)+'" x2="'+sx(100)+'" y2="'+sy(100)+'" style="stroke:var(--ink-faint)" stroke-width="1"/>';
  st.levels.forEach(function(l){ svg+='<text x="'+sx(100*l.p)+'" y="'+(Y0+18)+'" text-anchor="middle" font-size="11" style="fill:var(--ink-soft)">'+l.label+'</text><text x="'+sx(100*l.p)+'" y="'+(Y0+32)+'" text-anchor="middle" font-size="10" style="fill:var(--ink-faint)">said '+Math.round(100*l.p)+'%</text>'; });
  st.levels.forEach(function(l,i){ if(!l.n) return; var acc=100*l.right/l.n, x=sx(100*l.p), y=sy(acc);
    svg+='<g class="cpt" tabindex="0" data-i="'+i+'" aria-label="'+l.label+': '+Math.round(acc)+' percent right over '+l.n+' answers"><circle cx="'+x+'" cy="'+y+'" r="16" fill="transparent"/><circle class="dot" cx="'+x+'" cy="'+y+'" r="6" style="fill:var(--aqua);stroke:var(--bg)" stroke-width="2"/></g>'; });
  svg+='</svg>';
  var rows=st.levels.map(function(l){ return '<tr><td>'+l.label+'</td><td>'+Math.round(100*l.p)+'%</td><td>'+(l.n?Math.round(100*l.right/l.n)+'%':'–')+'</td><td>'+l.n+'</td></tr>'; }).join('');
  var vs=C.verdicts(st).slice(0,3);
  el.innerHTML=head+'<p class="tally">Each dot shows how often you were right at that confidence. On the line, confidence matches results; below it, you were less often right than you thought.</p>'
    +'<div class="two"><div class="cchart" style="position:relative;max-width:26rem">'+svg+'<div class="ctip" role="status" hidden></div></div>'
    +'<div><table><tr><th>You said</th><th>Meaning</th><th>Right</th><th>Answers</th></tr>'+rows+'</table>'
    +'<p class="tally">Calibration score '+st.brier.toFixed(2)+' over '+st.n+' rated answers. Lower is better: 0 is perfect, and saying Unsure every time at 60% accuracy scores 0.24.</p><p class="tally" id="confweek"></p></div></div>'
    +(vs.length?vs.map(function(v){ return '<div class="rec">'+esc(v.text)+'</div>'; }).join(''):'<p class="tally">A verdict for a technique appears once it has '+C.MIN+' rated answers.</p>');
  /* tooltip: value first, level second; same on hover and keyboard focus */
  var box=el.querySelector('.cchart'), tip=el.querySelector('.ctip');
  function showTip(g){ var l=st.levels[+g.getAttribute('data-i')], r=g.querySelector('.dot').getBoundingClientRect(), b=box.getBoundingClientRect();
    tip.textContent=''; var s=document.createElement('strong'); s.textContent=Math.round(100*l.right/l.n)+'% right'; var sp=document.createElement('span'); sp.textContent=l.label+', '+l.n+' answer'+(l.n>1?'s':'');
    tip.appendChild(s); tip.appendChild(sp); tip.hidden=false;
    tip.style.left=Math.max(0,Math.min(b.width-150,r.left-b.left-60))+'px'; tip.style.top=Math.max(0,r.top-b.top-54)+'px'; }
  el.querySelectorAll('.cpt').forEach(function(g){ g.addEventListener('pointerenter',function(){ showTip(g); }); g.addEventListener('focus',function(){ showTip(g); });
    g.addEventListener('pointerleave',function(){ tip.hidden=true; }); g.addEventListener('blur',function(){ tip.hidden=true; }); });
  paintConfWeek(); }
function paintConfWeek(){ var p=document.getElementById('confweek'), H=window.HU_REWARDS; if(!p||!H||!H.calibration) return; confWeekShown=true;
  var W=H.calibration.weeks(L), R=H.calibration.rule, cur=W.filter(function(w){ return !w.finished; })[0], last=W.filter(function(w){ return w.finished; }).slice(-1)[0];
  p.textContent=(cur?'This week: '+cur.n+' rated answer'+(cur.n===1?'':'s')+(cur.n<R.min?', '+(R.min-cur.n)+' more for the calibration bonus.':', score '+cur.brier.toFixed(2)+(cur.brier<=R.maxBrier?', on track for the bonus.':'; the bonus needs '+R.maxBrier.toFixed(2)+' or lower.')):'No rated answers yet this week.')
    +(last&&last.earned?' Last week earned the calibration bonus.':''); }
paintConf();
window.addEventListener('hu-rewards',function(){ if(!confWeekShown) paintConfWeek(); });
